# ======================================================
# Project metadata (used for documentation / review)
# ======================================================
project:
  title: "Low-Power Root of Trust"   # Project title (e.g. "Simple CPU", "PLL", "ADC")
  team: "D16 Silicon Bears"                      # Your Team name
  discord: "ema01710"                   # Optional: Discord username (for support / communication)
  description: "OpenTitan-derived mini Root-of-Trust: Ibex core + TL-UL crossbar + UART, secure boot with an ECDSA (secp160r1) key derived at runtime from a physical SRAM PUF"
  lvs_config: "lvs_config.json"

pins:
  - name: VDD
    io_type: power
  - name: VSS
    io_type: ground  # note: due to a common ground connection, ground pads are generally not needed.
  - name: clk_i
    io_type: input_schmitt
#PUF debug pins need to be addded
  - name: rst_ni
    io_type: input_cmos
  - name: uart_rx_i
    io_type: input_cmos
  - name: uart_tx_o
    io_type: bidirectional
  - name: uart_tx_en_o
    io_type: bidirectional
  - name: qspi_sclk_o
    io_type: bidirectional
  - name: qspi_cs_n_o
    io_type: bidirectional
  - name: qspi_io_o[0]
    io_type: bidirectional
  - name: qspi_io_o[1]
    io_type: bidirectional
  - name: qspi_io_o[2]
    io_type: bidirectional
  - name: qspi_io_o[3]
    io_type: bidirectional
  - name: qspi_io_i[0]
    io_type: bidirectional
  - name: qspi_io_i[1]
    io_type: bidirectional
  - name: qspi_io_i[2]
    io_type: bidirectional
  - name: qspi_io_i[3]
    io_type: bidirectional
  - name: qspi_io_oe_o
    io_type: bidirectional
